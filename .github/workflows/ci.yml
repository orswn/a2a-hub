name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt-check RUN=
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln RUN=

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            test/package-lock.json
      - run: make protocol-test contract process RUN=

  image:
    # Builds and runs the image on every push and pull request, so Containerfile errors show before a release.
    # Only a v* tag pushes it.
    needs: [test, vuln, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
      # The binary reports the version without the v, like make build.
      - id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: a2a-hub:smoke
          labels: ${{ steps.meta.outputs.labels }}
          load: true
      # The anonymous volume of VOLUME /data takes its owner from the image, so a started hub proves that
      # nonroot can write there.
      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name hub -p 127.0.0.1:8080:8080 a2a-hub:smoke
          trap 'docker logs hub; docker rm -f hub > /dev/null' EXIT
          for _ in $(seq 20); do
            if docker exec hub /a2a-hub healthcheck; then break; fi
            sleep 1
          done
          docker exec hub /a2a-hub healthcheck
          body="$(curl -fsS http://127.0.0.1:8080/healthz)"
          echo "$body"
          test "$body" = "{\"ok\":true,\"version\":\"$VERSION\",\"agents\":0}"
          docker cp hub:/data - | tar --numeric-owner -tvf - | tee "$RUNNER_TEMP/data.txt"
          grep -E '^d\S+ 65532/65532 .* data/$' "$RUNNER_TEMP/data.txt"
          grep -E '^-\S+ 65532/65532 .* data/hub\.sqlite$' "$RUNNER_TEMP/data.txt"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builder and inputs as the build step, so this push reuses its cached layers.
      - id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
      - name: Write the image digest to the summary
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "image id: \`$IMAGE_ID\`"
            if [ -n "$DIGEST" ]; then
              echo "pushed: \`$TAGS@$DIGEST\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUB_URL: http://127.0.0.1:18080
      TCK_COMMIT: 70f6f73c30208e80c889141907e094899e6e9f05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build RUN=
      - name: Start the hub
        run: |
          bin/a2a-hub --test-agents --listen 127.0.0.1:18080 --data "$RUNNER_TEMP/hub" > "$RUNNER_TEMP/hub.log" 2>&1 &
          for _ in $(seq 1 50); do bin/a2a-hub healthcheck --listen 127.0.0.1:18080 && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/hub.log"
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Run a2a-tck
        run: |
          git init -q "$RUNNER_TEMP/tck"
          cd "$RUNNER_TEMP/tck"
          git remote add origin https://github.com/a2aproject/a2a-tck.git
          git fetch -q --depth 1 origin "$TCK_COMMIT"
          git checkout -q FETCH_HEAD
          uv sync --frozen
          # The gate below decides: SHOULD and MAY gaps do not fail the job.
          uv run python run_tck.py --sut-host "$HUB_URL/a2a/tck" --transport jsonrpc || true
      - run: python3 scripts/tck-gate.py "$RUNNER_TEMP/tck/reports"
      - run: uv run scripts/hub-python-client.py "$HUB_URL"
      - if: failure()
        run: cat "$RUNNER_TEMP/hub.log"
