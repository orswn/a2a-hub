version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    gosec:
      excludes:
        # The data and config paths come from the operator, not from a request.
        - G304
        - G301
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
